# Fills in the App Store listing (texts in store/listing.json, screenshots in
# store/screenshots, age rating, price, availability, build, Game Center)
# through the App Store Connect API, and submits the version for review when
# asked. Run by hand: Actions → App Store listing → Run workflow.
name: App Store listing

on:
  workflow_dispatch:
    inputs:
      build:
        description: Build number to attach (waits for Apple's processing); empty = newest processed build
        required: false
      contact_first_name:
        description: App Review contact — first name (empty = the Mafia app's contact)
        required: false
      contact_last_name:
        description: App Review contact — last name
        required: false
      contact_phone:
        description: App Review contact — phone with country code
        required: false
      contact_email:
        description: App Review contact — email
        required: false
      submit:
        description: Submit the version for App Review
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fill in the listing
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_BUNDLE_ID: com.espadna.shahdozd
          BUILD: ${{ inputs.build }}
          REVIEW_FIRST_NAME: ${{ inputs.contact_first_name }}
          REVIEW_LAST_NAME: ${{ inputs.contact_last_name }}
          REVIEW_PHONE: ${{ inputs.contact_phone }}
          REVIEW_EMAIL: ${{ inputs.contact_email }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          export VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          node tools/appstore_listing.mjs
