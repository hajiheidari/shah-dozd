# Android: builds the Play bundle (AAB), the Cafe Bazaar APK and the
# direct-download APKs when app code changes, and by hand.
#
# Signing: the upload key is kept in Cloudflare Workers KV (namespace
# "mafia-ci", key "shahdozd-android-upload-key": base64 keystore, alias and
# password). The first run on main creates it; every later run reuses it, so
# Cafe Bazaar and Google Play always see the same key. Never delete that KV
# entry: Bazaar cannot change an app's key. Repository secrets
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD, if set, take precedence. Branch runs without a kept
# key are debug-signed (testing only).
# Ad ids (docs/MONETIZATION.md), repository *variables* (Settings → Secrets
# and variables → Actions → Variables): ADMOB_REWARDED_ANDROID, ADIVERY_APP_ID,
# ADIVERY_REWARDED. Unset = AdMob test ads / Adivery off.
# Nothing is published: download the files from the run's artifacts.
name: Android

on:
  push:
    branches: ['**']
    paths: ['lib/**', 'android/**', 'assets/**', 'pubspec.*', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          JKS="$RUNNER_TEMP/upload.jks"
          if [[ -n "$KS" ]]; then
            echo "$KS" | base64 -d > "$JKS"
          elif [[ -n "$CLOUDFLARE_API_TOKEN" ]]; then
            ns=$(node tools/cf_kv.mjs mafia-ci)
            url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$ns/values/shahdozd-android-upload-key"
            code=$(curl -s -o "$RUNNER_TEMP/key.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url")
            if [[ $code == 404 && $IS_MAIN == true ]]; then
              pass=$(openssl rand -hex 24)
              echo "::add-mask::$pass"
              keytool -genkeypair -keystore "$JKS" -storetype PKCS12 -alias upload -keyalg RSA -keysize 4096 -validity 10000 \
                -storepass "$pass" -keypass "$pass" -dname "CN=Espadna, O=Espadna, C=US" >/dev/null 2>&1
              jq -n --arg jks "$(base64 -w0 "$JKS")" --arg pass "$pass" '{jks:$jks, alias:"upload", password:$pass}' > "$RUNNER_TEMP/key.json"
              curl -sf -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: text/plain' --data-binary @"$RUNNER_TEMP/key.json" "$url" >/dev/null
              echo "::notice::Created the Android upload key and kept it in Cloudflare KV (mafia-ci / shahdozd-android-upload-key)."
            elif [[ $code != 200 ]]; then
              rm -f "$RUNNER_TEMP/key.json"
              echo "::warning::No kept Android upload key (HTTP $code): debug-signed builds (not for stores)."; exit 0
            fi
            KS_PASSWORD=$(jq -r .password "$RUNNER_TEMP/key.json")
            echo "::add-mask::$KS_PASSWORD"
            jq -r .jks "$RUNNER_TEMP/key.json" | base64 -d > "$JKS"
            KS_ALIAS=$(jq -r .alias "$RUNNER_TEMP/key.json"); KS_KEY_PASSWORD=$KS_PASSWORD
            rm -f "$RUNNER_TEMP/key.json"
          else
            echo "::warning::No signing key: debug-signed builds (not for stores)."; exit 0
          fi
          cat > android/key.properties <<PROPS
          storeFile=$JKS
          storePassword=$KS_PASSWORD
          keyAlias=$KS_ALIAS
          keyPassword=$KS_KEY_PASSWORD
          PROPS
          keytool -list -v -keystore "$JKS" -storepass "$KS_PASSWORD" -alias "$KS_ALIAS" | grep -E 'SHA256:|SHA1:' | sed 's/^/upload key /'
      - name: Google Play (AAB)
        run: flutter build appbundle --release --flavor play --dart-define=CHANNEL=play --dart-define=ADMOB_REWARDED_ANDROID=${{ vars.ADMOB_REWARDED_ANDROID }} --dart-define=ADIVERY_APP_ID=${{ vars.ADIVERY_APP_ID }} --dart-define=ADIVERY_REWARDED=${{ vars.ADIVERY_REWARDED }}
      - name: Cafe Bazaar (APK)
        run: flutter build apk --release --flavor bazaar --dart-define=CHANNEL=bazaar --dart-define=ADMOB_REWARDED_ANDROID=${{ vars.ADMOB_REWARDED_ANDROID }} --dart-define=ADIVERY_APP_ID=${{ vars.ADIVERY_APP_ID }} --dart-define=ADIVERY_REWARDED=${{ vars.ADIVERY_REWARDED }}
      - name: Direct download (universal + per-ABI APKs)
        run: |
          flutter build apk --release --flavor direct --dart-define=CHANNEL=apk --dart-define=ADMOB_REWARDED_ANDROID=${{ vars.ADMOB_REWARDED_ANDROID }} --dart-define=ADIVERY_APP_ID=${{ vars.ADIVERY_APP_ID }} --dart-define=ADIVERY_REWARDED=${{ vars.ADIVERY_REWARDED }}
          flutter build apk --release --flavor direct --dart-define=CHANNEL=apk --split-per-abi --dart-define=ADMOB_REWARDED_ANDROID=${{ vars.ADMOB_REWARDED_ANDROID }} --dart-define=ADIVERY_APP_ID=${{ vars.ADIVERY_APP_ID }} --dart-define=ADIVERY_REWARDED=${{ vars.ADIVERY_REWARDED }}
      - name: No required optional libraries (Cafe Bazaar hides such apps)
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-bazaar-release.apk build/app/outputs/flutter-apk/app-direct-release.apk; do
            # Every <uses-library> must say required=false.
            bad=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk" | awk '
              /E: uses-library/ { if (lib != "" && !opt) print lib; lib = "?"; opt = 0; next }
              lib != "" && /android:name\(/ { match($0, /"[^"]*"/); lib = substr($0, RSTART + 1, RLENGTH - 2); next }
              lib != "" && /android:required\(.*=false/ { opt = 1; next }
              lib != "" && /E: / { if (!opt) print lib; lib = "" }
              END { if (lib != "" && !opt) print lib }')
            if [[ -n "$bad" ]]; then echo "::error::$apk requires: $bad"; exit 1; fi
          done
          echo "all uses-library entries are optional"
      - uses: actions/upload-artifact@v4
        with:
          name: shahdozd-android
          path: |
            build/app/outputs/bundle/playRelease/*.aab
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30
